<main>
  <h2>场地在哪</h2>
  <p>青藤社区活动中心二层阅览室（青藤路 18 号）。从正门进，右手边楼梯上二层，走廊尽头就是阅览室；有电梯，在一层大厅左侧。</p>

  <svg class="map" viewBox="0 0 640 360" role="img" aria-label="活动中心示意图">
    <rect x="0" y="0" width="640" height="360" fill="#fff"/>
    <rect x="40" y="40" width="560" height="280" fill="none" stroke="#1f3a5f" stroke-width="3"/>
    <text x="300" y="30" font-size="16" text-anchor="middle" fill="#142a45">社区活动中心 · 二层平面示意</text>
    <rect x="60" y="60" width="200" height="110" fill="#e6edf7" stroke="#1f3a5f"/>
    <text x="160" y="120" font-size="16" text-anchor="middle">阅览室（活动在这里）</text>
    <rect x="280" y="60" width="140" height="110" fill="#f3f3f3" stroke="#999"/>
    <text x="350" y="120" font-size="15" text-anchor="middle">儿童区</text>
    <rect x="440" y="60" width="140" height="110" fill="#f3f3f3" stroke="#999"/>
    <text x="510" y="120" font-size="15" text-anchor="middle">办公室</text>
    <rect x="60" y="200" width="520" height="40" fill="#fafafa" stroke="#bbb"/>
    <text x="320" y="226" font-size="14" text-anchor="middle" fill="#666">走廊</text>
    <rect x="60" y="260" width="90" height="50" fill="#fff3cc" stroke="#f2b134"/>
    <text x="105" y="290" font-size="14" text-anchor="middle">楼梯</text>
    <rect x="490" y="260" width="90" height="50" fill="#fff3cc" stroke="#f2b134"/>
    <text x="535" y="290" font-size="14" text-anchor="middle">电梯</text>
    <text x="320" y="345" font-size="13" text-anchor="middle" fill="#666">正门在一层，进门右手楼梯、左手电梯，都到二层</text>
  </svg>

  <h2>怎么来</h2>
  <ul>
    <li>公交：社区活动中心站下车，步行约 3 分钟。</li>
    <li>骑行：活动中心门口有自行车停放点。</li>
    <li>开车：活动中心没有停车场，请停到青藤路路侧的公共车位。</li>
  </ul>

  <div class="notice">找不到的话，到一层前台说“来读书会”，工作人员会带你上去。</div>
